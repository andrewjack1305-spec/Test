name: Test OANDA Auth

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test OANDA credentials
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: |
          echo "Account ID length: ${#OANDA_ACCOUNT_ID}"
          echo "API key length: ${#OANDA_API_KEY}"
          curl -s -o response.json -w "HTTP status: %{http_code}\n" \
            -H "Authorization: Bearer $OANDA_API_KEY" \
            "https://api-fxpractice.oanda.com/v3/accounts/$OANDA_ACCOUNT_ID/instruments/XAU_USD/candles?count=1"
          cat response.json
